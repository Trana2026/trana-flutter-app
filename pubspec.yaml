name: trana
description: "A new Flutter project."
publish_to: "none"

version: 1.0.1+11

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.10.0
  firebase_messaging: ^16.4.1
  firebase_analytics: ^12.4.5

  # freezed, riverpod
  hooks_riverpod: ^3.3.1
  flutter_hooks: ^0.21.3+1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  riverpod_annotation: ^4.0.2

  # 이미지
  image_picker: ^1.2.2
  image: ^4.8.0
  wechat_assets_picker: ^10.1.2
  flutter_image_compress: ^2.4.0
  cached_network_image: ^3.4.1

  # 디자인/UI
  flutter_svg: ^2.3.0
  cupertino_icons: ^1.0.8
  dotted_border: ^3.1.0
  fluttertoast: ^9.0.0
  dropdown_button2: ^3.1.0
  custom_refresh_indicator: ^4.0.1
  lottie: ^3.3.3
  markdown_widget: ^2.3.2+8
  markdown: ^7.3.1

  # etc.
  syncfusion_flutter_pdfviewer: ^32.2.8
  syncfusion_flutter_signaturepad: ^32.2.9
  syncfusion_flutter_core: ^32.2.9
  syncfusion_flutter_pdf: ^32.2.9
  camera: ^0.12.0
  camera_android: ^0.10.9+9 # Camera2 강제 사용 (CameraX AePreCaptureTask Samsung 버그 회피)
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  radar_chart_plus: ^2.3.0
  go_router: ^14.6.3
  flutter_dotenv: ^5.2.1
  crypto: ^3.0.6
  dio: ^5.9.2
  flutter_secure_storage: ^10.3.1
  kakao_flutter_sdk_user: ^2.0.0+1
  google_mlkit_text_recognition: ^0.15.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  local_auth: ^3.0.1
  share_plus: ^12.0.2
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.2
  play_install_referrer: ^0.5.0
  device_info_plus: ^12.4.0
  package_info_plus: ^9.0.0
  ios_utsname_ext: ^2.3.0
  flutter_local_notifications: ^22.0.1
  http_parser: ^4.1.2
  amplitude_flutter: ^4.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  json_serializable: ^6.13.0
  freezed: ^3.2.5
  riverpod_generator: ^4.0.3
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: assets/images/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/images/tutorial_popup/
    - assets/icons/
    - assets/anim/
    - assets/anim/tutorial_popup/

  fonts:
    # Coolicons 아이콘
    - family: coolicons
      fonts:
        - asset: assets/fonts/coolicons.ttf
    # Prdtendard 폰트
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Thin.ttf
          weight: 100
        - asset: assets/fonts/Pretendard-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Pretendard-Light.ttf
          weight: 300
        - asset: assets/fonts/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Pretendard-Black.ttf
          weight: 900
    # Legacy separate font families
    - family: PretendardBlack
      fonts:
        - asset: assets/fonts/Pretendard-Black.ttf
    - family: PretendardExtraBold
      fonts:
        - asset: assets/fonts/Pretendard-ExtraBold.ttf
    - family: PretendardBold
      fonts:
        - asset: assets/fonts/Pretendard-Bold.ttf
    - family: PretendardSemiBold
      fonts:
        - asset: assets/fonts/Pretendard-SemiBold.ttf
    - family: PretendardMedium
      fonts:
        - asset: assets/fonts/Pretendard-Medium.ttf
    - family: PretendardRegular
      fonts:
        - asset: assets/fonts/Pretendard-Regular.ttf
    - family: PretendardLight
      fonts:
        - asset: assets/fonts/Pretendard-Light.ttf
    - family: PretendardExtraLight
      fonts:
        - asset: assets/fonts/Pretendard-ExtraLight.ttf
    - family: PretendardThin
      fonts:
        - asset: assets/fonts/Pretendard-Thin.ttf
